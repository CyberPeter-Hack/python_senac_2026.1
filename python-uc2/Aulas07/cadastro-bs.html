    <main class="bg-light py-4">

        <div class="container">

            <div class="row">
                <!-- Formulário de Cadastro -->
         <form action="cadastro/" method="get" target="_blank">
        
            <!-- Nome Completo -->
            <div class="mb-3">
                <label for="nome_completo" class="form-label">Nome Completo:</label>
                <input type="text" class="form-control" id="nome_completo" name="nome_completo"  
                    placeholder="Digite seu nome completo" required>
            </div>
            
            <!-- Data de Nascimento / Sexo -->
            <div class="row">
                <div class="col-10">
                    <label for="data_nascimento" class="form-label">Data de Nascimento:</label>
                    <input type="date" class="form-control" id="data_nascimento" name="data_nascimento" 
                        required>
                </div>
                <div class="col-2">
                    <label for="sexo" class="form-label">Sexo:</label><br>    
                    <input type="radio" id="html" name="fav_language" value="Masculino">
                    <label for="MASC">Masculino</label><br>
                    <input type="radio" id="css" name="fav_language" value="Feminino">
                    <label for="FEM">Feminino</label><br>
                    <input type="radio" id="javascript" name="fav_language" value="Outro">
                    <label for="OUTRO">Outro</label>
                </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" class="form-control" id="email" name="email" 
                    placeholder="Digite seu email" required>
            </div>

            <!-- Senha / Confirmar Senha -->
            <div class="row">
                <div class="col-6">
                <label for="senha" class="form-label">Senha:</label>
                <input type="password" class="form-control" id="senha" name="senha" 
                    placeholder="Digite sua senha" required minlength="8">
                </div>
                <div class="col-6">
                <label for="confirmar_senha" class="form-label">Confirmar Senha:</label>
                <input type="password" class="form-control" id="confirmar_senha" name="confirmar_senha" 
                    placeholder="Confirme sua senha" required minlength="8">
                </div>  
            </div>

            <!-- CPF -->
            <div class="mb-3">
                <label for="cpf" class="form-label">CPF:</label>
                <input type="text" class="form-control" id="cpf" name="cpf" 
                    placeholder="xxx-xxx-xxx-xx" required>
            </div>

            <!-- Logradouro -->
            <div class="mb-3">
                <label for="lougradouro" class="form-label">Logradouro:</label>
                <input type="text" class="form-control" id="lougradouro" name="lougradouro" 
                    placeholder="Digite seu logradouro" required>
            </div>

            <!-- CEP -->
            <div class="mb-3">
                <label for="cep" class="form-label">CEP:</label>
                <input type="text" class="form-control" id="cep" name="cep" 
                    placeholder="xxxxx-xxx" required> 
            </div>

            <!-- Complemento -->
            <div class="mb-3">
                <label for="complemento" class="form-label">Complemento:</label>
                <input type="text" class="form-control" id="complemento" name="complemento" 
                    placeholder="Digite o complemento" required>
            </div>

            <!-- Bairro -->
            <div class="mb-3">
                <label for="Bairro" class="form-label">Bairro:</label>
                <input type="text" class="form-control" id="Bairro" name="Bairro" 
                    placeholder="Digite seu bairro" required>
            </div>

            <!-- Cidade -->
            <div class="mb-3">
                <label for="Cidade" class="form-label">Cidade:</label>
                <input type="text" class="form-control" id="Cidade" name="Cidade" 
                    placeholder="Digite sua cidade" required>
            </div>

    
            <!-- Estado -->
            <div class="mb-3">
                <label for="Estado" class="form-label">Estado:</label>
                <input type="text" class="form-control" id="Estado" name="Estado" 
                    placeholder="Digite seu estado" required>
            </div>

            <!-- Botão de Envio -->
            <div class="n-3 row">
                <div class="col-6">
                <button type="submit" 
                    class="form-control btn btn-outline-primary">
                    Enviar
                </button>
            </div>
            <div class="col-6">
                <button type="reset" 
                    class="form-control btn btn-outline-secondary">
                    Limpar</button>
            </div>
        </div>
        </form>
