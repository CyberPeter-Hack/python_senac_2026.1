<!DOCTYPE html>
<html lang="pt-BR">
<!-- Inicio do Head-->
<head>  
    <title>[MUDAR]</title>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <meta name="description" content="[MUDAR]">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
        rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" 
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">

    <style>
        .adicionar_borda {
           border-width: 1px;
           border-style: solid;
           border-color: black;            
        }
    </style>

</head>
<!-- Final do Head-->

<!-- Inicio do Body -->
<body class="bg-secondary">
<!-- 
    DIV - Prinicipal
    Area principal do site contem o 
        - Header
        - Main 
        - Footer
 -->

<div id="div_principal" class="container adicionar_borda bg-light">
    <!--
        Header da pagina 
        [-] Logotipo 
        [-] Titulo
        [-] Menu Principal
        [-] Login / Logout / Criar conta
    -->
    <header class="adicionar_borda">
       <div class="row">
            <div class="col-12">
                Logo / Titulo
            </div>
       </div> 

           <div class="row mb-3 me-1">
            <div class="col-9">
                Menu Principal
            </div>
            <div class="col-3 text-end">
                <button
                class="btn btn-primary">
                <i class="fa-solid fa-right-to-bracket"></i>   
                Login
                </button>
                <button
                class="btn btn-secondary">
                <i class="fa-solid fa-right-from-bracket"></i>   
                Logout
                </button>
                <button
                class="btn btn-success">
                <i class="fa-solid fa-user-plus"></i>   
                </button>
            </div>
       </div>
    </header>

    <!-- 
        Main da pagina 
    -->
    <main class="adicionar_borda">
        <!-- Formulário de Cadastro -->
         <form action="cadastro/" method="get" target="_blank">
        
            <!-- Nome Completo -->
            <div class="mb-3">
                <label for="nome_completo" class="form-label">Nome Completo:</label>
                <input type="text" class="form-control" id="nome_completo" name="nome_completo"  
                    placeholder="Digite seu nome completo" required>
            </div>
            
            <!-- Data de Nascimento / Sexo -->
            <div class="row">
                <div class="col-10">
                    <label for="data_nascimento" class="form-label">Data de Nascimento:</label>
                    <input type="date" class="form-control" id="data_nascimento" name="data_nascimento" 
                        required>
                </div>
                <div class="col-2">
                    <label for="sexo" class="form-label">Sexo:</label><br>    
                    <input type="radio" id="html" name="fav_language" value="Masculino">
                    <label for="MASC">Masculino</label><br>
                    <input type="radio" id="css" name="fav_language" value="Feminino">
                    <label for="FEM">Feminino</label><br>
                    <input type="radio" id="javascript" name="fav_language" value="Outro">
                    <label for="OUTRO">Outro</label>
                </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" class="form-control" id="email" name="email" 
                    placeholder="Digite seu email" required>
            </div>

            <!-- Senha / Confirmar Senha -->
            <div class="row">
                <div class="col-6">
                <label for="senha" class="form-label">Senha:</label>
                <input type="password" class="form-control" id="senha" name="senha" 
                    placeholder="Digite sua senha" required minlength="8">
                </div>
                <div class="col-6">
                <label for="confirmar_senha" class="form-label">Confirmar Senha:</label>
                <input type="password" class="form-control" id="confirmar_senha" name="confirmar_senha" 
                    placeholder="Confirme sua senha" required minlength="8">
                </div>  
            </div>

            <!-- CPF -->
            <div class="mb-3">
                <label for="cpf" class="form-label">CPF:</label>
                <input type="text" class="form-control" id="cpf" name="cpf" 
                    placeholder="xxx-xxx-xxx-xx" required>
            </div>

            <!-- Logradouro -->
            <div class="mb-3">
                <label for="lougradouro" class="form-label">Logradouro:</label>
                <input type="text" class="form-control" id="lougradouro" name="lougradouro" 
                    placeholder="Digite seu logradouro" required>
            </div>

            <!-- CEP -->
            <div class="mb-3">
                <label for="cep" class="form-label">CEP:</label>
                <input type="text" class="form-control" id="cep" name="cep" 
                    placeholder="xxxxx-xxx" required> 
            </div>

            <!-- Complemento -->
            <div class="mb-3">
                <label for="complemento" class="form-label">Complemento:</label>
                <input type="text" class="form-control" id="complemento" name="complemento" 
                    placeholder="Digite o complemento" required>
            </div>

            <!-- Bairro -->
            <div class="mb-3">
                <label for="Bairro" class="form-label">Bairro:</label>
                <input type="text" class="form-control" id="Bairro" name="Bairro" 
                    placeholder="Digite seu bairro" required>
            </div>

            <!-- Cidade -->
            <div class="mb-3">
                <label for="Cidade" class="form-label">Cidade:</label>
                <input type="text" class="form-control" id="Cidade" name="Cidade" 
                    placeholder="Digite sua cidade" required>
            </div>

    
            <!-- Estado -->
            <div class="mb-3">
                <label for="Estado" class="form-label">Estado:</label>
                <input type="text" class="form-control" id="Estado" name="Estado" 
                    placeholder="Digite seu estado" required>
            </div>

            <!-- Botão de Envio -->
            <div class="n-3 row">
                <div class="col-6">
                <button type="submit" 
                    class="form-control btn btn-outline-primary">
                    Enviar
                </button>
            </div>
            <div class="col-6">
                <button type="reset" 
                    class="form-control btn btn-outline-secondary">
                    Limpar</button>
            </div>
        </div>
        </form>        
    </main>

    <!--
        Footer da pagina 
        [-] Menu Secundário
        [-] Contato
        [-] Copyright do site
        [-] Redes Sociais
    -->
    <footer class="adicionar_borda">
        <div class="row">
            <div class="col-4">
                Menu Secundário
            </div>
        
            <div class="col-5">
                Contato <br> 
                Copyright do site
            </div>
            <!--
                Redes Sociais - GitHub, LinkedIn, Instagram, Facebook, youtube
            -->
            <div class="col-3">
               <button class="btn btn-outline-dark" title="GitHub">
                <a href="https://github.com/CyberPeter-Hacker" target="_blank" title="GitHub"><i class="fa-brands fa-square-github"></i></a>
               </button>
               <button class="btn btn-outline-dark" title="LinkedIn">
                <a href="https://www.linkedin.com/in/guilherme-blanc-818a49290/" target="_blank" title="LinkedIn"><i class="fa-brands fa-square-linkedin"></i></a>
               </button>
               <button class="btn btn-outline-dark" title="Instagram">
                <a href="https://www.instagram.com/guiblanc710/" target="_blank" title="Instagram"><i class="fa-brands fa-square-instagram"></i></a>
               </button>
            </div>
            </div>
    </footer>
</div> 
<!-- Final da Div Principal-->   

<!-- Não apague a tag "SCRIPT" -->
<!-- Bootstrap JS e dependências -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>
<!-- Não apague a tag "SCRIPT" -->
</body>
<!-- Final do Body-->
</html>
