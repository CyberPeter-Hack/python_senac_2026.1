<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Pagina HTLM 5</title>
    <meta name="description" content="Uma página de exemplo para demonstrar
                    a estrutura básica do HTLM5 com Bootstrap e Font Awesome.">

<!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
         rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" 
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">


    <style>
        header {
            border-color: rgb(17, 0, 0);
            border-width: 1px;
            border-style: solid;
            padding-top: 20px;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>
        <section>
            <h1>Exemplo de uso de imagem</h1>
            <h2>1ª Imagem</h2>
            <img src="img/paisagem.jpg"
                width="820px"
                alt="Por do Sol - Praia Grande - Arraial do Cabo">
                <figcaption> Figura 2: imagem de uma paisagem</figcaption>
            <hr>
        </section>
        <!-- Bootstrap JS e dependências -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>   
       

                <section>
            <h4>2ª Imagen</h4>
            <figure>
                <img src="img/landscape-9300672_1920.jpg" height="1000px"
                alt="Aqui tem uma Paisagem">
                <figcaption> Figura 2: imagem arte abstrata</figcaption>
            </figure>
            <hr>
        </section>

                <section>
            <h4>3ª Imagen</h4>
            <figure>
                <img src="img/daylily-6490922_1920.jpg" height="550px"
                alt="Aqui tem uma Paisagem">
                <figcaption> Figura 3: imagem de flor</figcaption>
            </figure>
            <hr>
        </section>

                <section>
            <h4>4ª Imagen</h4>
            <figure>
                <img src="img/house-8245930_1920.jpg" height="800px"
                alt="Aqui tem uma Paisagem">
                <figcaption> Figura 4: imagem de um desenho de uma casa</figcaption>
            </figure>
            <hr>
        </section>
    
    
    </script>

</body> 
</html>
